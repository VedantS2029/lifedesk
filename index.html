<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F6F3EC" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0D1311" media="(prefers-color-scheme: dark)">
    <title>Lifedesk — Personal Life OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
         :root {
            --bg: #F6F3EC;
            --bg2: #EDE8DD;
            --sf: #FFFDF9;
            --sf2: #F9F6EF;
            --ink: #16201D;
            --mute: #5E6B66;
            --line: #DCD5C7;
            --acc: #0D6E5B;
            --acc-soft: rgba(13, 110, 91, 0.11);
            --hot: #C85A32;
            --hot-soft: rgba(200, 90, 50, 0.12);
            --gold: #B8860B;
            --gold-soft: rgba(184, 134, 11, 0.13);
            --r: 14px;
            --r-lg: 20px;
            --sh: 0 2px 10px rgba(22, 32, 29, 0.04), 0 1px 2px rgba(22, 32, 29, 0.05);
            --serif: "Fraunces", Georgia, serif;
            --sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
            --mono: "JetBrains Mono", monospace;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        
        @media (prefers-color-scheme: dark) {
             :root:not([data-theme="light"]) {
                --bg: #0D1311;
                --bg2: #131B18;
                --sf: #151F1C;
                --sf2: #1A2622;
                --ink: #EAE6DF;
                --mute: #8E9E97;
                --line: #263530;
                --acc: #34D399;
                --acc-soft: rgba(52, 211, 153, 0.13);
                --hot: #F0805A;
                --hot-soft: rgba(240, 128, 90, 0.14);
                --gold: #FBBF24;
                --gold-soft: rgba(251, 191, 36, 0.14);
                --sh: 0 4px 20px rgba(0, 0, 0, 0.25);
            }
        }
        
         :root[data-theme="dark"] {
            --bg: #0D1311;
            --bg2: #131B18;
            --sf: #151F1C;
            --sf2: #1A2622;
            --ink: #EAE6DF;
            --mute: #8E9E97;
            --line: #263530;
            --acc: #34D399;
            --acc-soft: rgba(52, 211, 153, 0.13);
            --hot: #F0805A;
            --hot-soft: rgba(240, 128, 90, 0.14);
            --gold: #FBBF24;
            --gold-soft: rgba(251, 191, 36, 0.14);
            --sh: 0 4px 20px rgba(0, 0, 0, 0.25);
        }
        
        * {
            box-sizing: border-box;
        }
        
        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
        }
        
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 400 15px/1.55 var(--sans);
            -webkit-font-smoothing: antialiased;
        }
        
        .app {
            display: grid;
            grid-template-columns: 248px 1fr;
            gap: 28px;
            max-width: 1320px;
            margin: 0 auto;
            padding: 22px 20px 60px;
            min-height: 100vh;
        }
        /* Sidebar */
        
        .side {
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: sticky;
            top: 20px;
            align-self: start;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            padding-right: 4px;
        }
        
        .brand-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        
        .brand h1 {
            font-family: var(--serif);
            font-size: 27px;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin: 0;
            line-height: 1.1;
        }
        
        .brand p {
            margin: 2px 0 0;
            color: var(--mute);
            font-size: 12.5px;
        }
        
        .icon-btn {
            all: unset;
            cursor: pointer;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--sf);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--mute);
        }
        
        .icon-btn:hover {
            color: var(--ink);
            border-color: var(--ink);
        }
        
        .cmd-trig {
            all: unset;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 11px;
            background: var(--sf);
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 13px;
            color: var(--mute);
            box-shadow: var(--sh);
        }
        
        .cmd-trig:hover {
            border-color: var(--acc);
            color: var(--ink);
        }
        
        .kbd {
            font-family: var(--mono);
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 6px;
            background: var(--bg2);
            color: var(--ink);
            border: 1px solid var(--line);
        }
        
        nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .nav-grp {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .nav-lbl {
            font-family: var(--mono);
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--mute);
            padding: 4px 10px 3px;
            font-weight: 600;
        }
        
        nav button {
            all: unset;
            cursor: pointer;
            padding: 7.5px 10px;
            border-radius: 10px;
            font-weight: 500;
            font-size: 14px;
            color: var(--mute);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            transition: background 0.12s, color 0.12s;
        }
        
        nav button:hover {
            background: var(--sf);
            color: var(--ink);
        }
        
        nav button.on {
            background: var(--ink);
            color: var(--bg);
            font-weight: 600;
        }
        
        nav button .b-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        nav button .ni {
            font-size: 14px;
            width: 18px;
            text-align: center;
            opacity: 0.85;
        }
        
        .nbadge {
            font-family: var(--mono);
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 99px;
            background: var(--bg2);
            color: var(--mute);
        }
        
        nav button.on .nbadge {
            background: rgba(255, 255, 255, 0.16);
            color: var(--bg);
        }
        
        .nbadge.hot {
            background: var(--hot-soft);
            color: var(--hot);
            font-weight: 600;
        }
        /* Focus & Controls */
        
        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible {
            outline: 2px solid var(--acc);
            outline-offset: 2px;
        }
        /* Header & Memory Bar */
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--line);
        }
        
        .top-title h2 {
            font-family: var(--serif);
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin: 0 0 3px;
            line-height: 1.15;
        }
        
        .top-title p {
            margin: 0;
            color: var(--mute);
            font-size: 13.5px;
        }
        
        .mem-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 99px;
            background: var(--sf);
            border: 1px solid var(--line);
            font-size: 12px;
            color: var(--mute);
            box-shadow: var(--sh);
        }
        
        .mem-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--acc);
            box-shadow: 0 0 0 3px var(--acc-soft);
        }
        
        .mem-dot.off {
            background: var(--hot);
            box-shadow: 0 0 0 3px var(--hot-soft);
        }
        /* Cards & Grids */
        
        .bento {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 14px;
            margin-bottom: 14px;
        }
        
        .col-12 {
            grid-column: span 12;
        }
        
        .col-8 {
            grid-column: span 8;
        }
        
        .col-7 {
            grid-column: span 7;
        }
        
        .col-6 {
            grid-column: span 6;
        }
        
        .col-5 {
            grid-column: span 5;
        }
        
        .col-4 {
            grid-column: span 4;
        }
        
        .col-3 {
            grid-column: span 3;
        }
        
        .card {
            background: var(--sf);
            border: 1px solid var(--line);
            border-radius: var(--r);
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: var(--sh);
        }
        
        .bento .card {
            margin-bottom: 0;
        }
        
        .card-hd {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        
        .card-hd h3,
        .card h3 {
            font-family: var(--serif);
            font-size: 18px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.01em;
        }
        
        .eyebrow {
            font-family: var(--mono);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--mute);
            display: block;
            margin-bottom: 4px;
        }
        
        .big-num {
            font-family: var(--serif);
            font-size: 32px;
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -0.02em;
        }
        
        .mono {
            font-family: var(--mono);
        }
        /* Inputs & Buttons */
        
        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            align-items: center;
        }
        
        input,
        textarea,
        select {
            font: inherit;
            color: var(--ink);
            background: var(--sf2);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 8.5px 11px;
            min-width: 0;
            transition: border-color 0.15s, background 0.15s;
        }
        
        input:focus,
        textarea:focus,
        select:focus {
            background: var(--sf);
        }
        
        textarea {
            width: 100%;
            resize: vertical;
        }
        
        .row input,
        .row select {
            flex: 1 1 130px;
        }
        
        .btn {
            font: inherit;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 8.5px 15px;
            background: var(--acc);
            color: #fff;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        
         :root[data-theme="dark"] .btn {
            color: #081C15;
        }
        
        @media (prefers-color-scheme: dark) {
             :root:not([data-theme="light"]) .btn {
                color: #081C15;
            }
        }
        
        .btn:hover {
            filter: brightness(1.06);
        }
        
        .btn.alt {
            background: var(--sf2);
            color: var(--ink);
            border: 1px solid var(--line);
        }
        
        .btn.alt:hover {
            border-color: var(--mute);
        }
        
        .btn.sm {
            padding: 5px 10px;
            font-size: 12.5px;
            border-radius: 8px;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: wait;
        }
        
        .x {
            all: unset;
            cursor: pointer;
            color: var(--mute);
            padding: 2px 7px;
            border-radius: 7px;
            font-size: 13px;
        }
        
        .x:hover {
            color: var(--hot);
            background: var(--hot-soft);
        }
        /* Sub-tabs (Segmented Control) */
        
        .seg {
            display: inline-flex;
            background: var(--bg2);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--line);
            margin-bottom: 16px;
            gap: 4px;
            flex-wrap: wrap;
        }
        
        .seg button {
            all: unset;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--mute);
        }
        
        .seg button.on {
            background: var(--sf);
            color: var(--ink);
            box-shadow: var(--sh);
        }
        /* Items & Lists */
        
        .item {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
        }
        
        .item b {
            display: block;
            font-weight: 600;
        }
        
        .item small,
        .mute {
            color: var(--mute);
        }
        
        .txt {
            white-space: pre-wrap;
            line-height: 1.6;
        }
        
        .empty {
            color: var(--mute);
            padding: 16px;
            text-align: center;
            border: 1px dashed var(--line);
            border-radius: 12px;
            font-size: 13.5px;
            margin: 6px 0;
        }
        
        .ln {
            padding: 9px 0;
            border-top: 1px solid var(--line);
        }
        
        .ln:first-child {
            border-top: 0;
        }
        
        .ln small {
            color: var(--mute);
        }
        
        .warn {
            border-left: 4px solid var(--hot);
            padding: 9px 12px;
            margin: 6px 0;
            background: var(--hot-soft);
            border-radius: 8px;
            font-size: 13.5px;
        }
        
        .okk {
            border-left: 4px solid var(--acc);
            padding: 9px 12px;
            margin: 6px 0;
            background: var(--acc-soft);
            border-radius: 8px;
            font-size: 13.5px;
        }
        /* Pills & Chips */
        
        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        
        .chip {
            padding: 3.5px 10px;
            border: 1px solid var(--line);
            background: var(--sf2);
            border-radius: 99px;
            font-size: 12.5px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .chip.acc {
            background: var(--acc-soft);
            border-color: transparent;
            color: var(--acc);
            font-weight: 600;
        }
        
        .chip.hot {
            background: var(--hot-soft);
            border-color: transparent;
            color: var(--hot);
            font-weight: 600;
        }
        
        .chip.gold {
            background: var(--gold-soft);
            border-color: transparent;
            color: var(--gold);
            font-weight: 600;
        }
        /* Progress & Pips */
        
        .bar {
            height: 8px;
            background: var(--bg2);
            border-radius: 99px;
            overflow: hidden;
            margin: 6px 0;
        }
        
        .bar i {
            display: block;
            height: 100%;
            background: var(--acc);
            border-radius: 99px;
            transition: width 0.25s;
        }
        
        .bar.hot i {
            background: var(--hot);
        }
        
        .pips {
            display: flex;
            gap: 5px;
            margin: 8px 0;
            align-items: center;
        }
        
        .pip {
            width: 16px;
            height: 16px;
            border-radius: 5px;
            border: 1px solid var(--line);
            background: var(--sf2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }
        
        .pip.ok {
            background: var(--acc);
            border-color: var(--acc);
            color: #fff;
        }
        
        .pip.sk {
            background: var(--hot);
            border-color: var(--hot);
            color: #fff;
        }
        
        input[type=range] {
            width: 100%;
            padding: 0;
            accent-color: var(--acc);
            background: transparent;
            border: 0;
        }
        /* Checklists */
        
        .chk {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 9px 0;
            border-top: 1px solid var(--line);
        }
        
        .chk input[type=checkbox] {
            width: 18px;
            height: 18px;
            accent-color: var(--acc);
            flex: none;
            cursor: pointer;
        }
        
        .chk span {
            flex: 1;
        }
        
        .chk time,
        .chk small {
            color: var(--mute);
            font-family: var(--mono);
            font-size: 12px;
        }
        
        .chk.done span {
            text-decoration: line-through;
            color: var(--mute);
        }
        /* Calendar */
        
        .g7 {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }
        
        .g7>* {
            min-width: 0;
        }
        
        .g7 span {
            color: var(--mute);
            font-size: 12px;
            font-family: var(--mono);
            padding-bottom: 4px;
        }
        
        .day {
            all: unset;
            cursor: pointer;
            aspect-ratio: 1 / 0.82;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font-weight: 600;
            font-size: 13.5px;
            border: 1px solid transparent;
            background: var(--sf2);
        }
        
        .day:hover {
            border-color: var(--mute);
        }
        
        .day.tod {
            border-color: var(--acc);
            color: var(--acc);
        }
        
        .day.sel {
            background: var(--ink);
            color: var(--bg);
        }
        
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--acc);
        }
        
        .dot.bad {
            background: var(--hot);
        }
        
        .fl {
            display: flex;
            flex-direction: column;
            font-size: 11.5px;
            color: var(--mute);
            gap: 3px;
            font-weight: 500;
        }
        /* Chat & Trio */
        
        .chat {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
            max-height: 62vh;
            overflow-y: auto;
            padding: 4px;
        }
        
        .msg {
            max-width: 85%;
            padding: 12px 15px;
            border-radius: var(--r);
            white-space: pre-wrap;
            line-height: 1.55;
        }
        
        .msg.user {
            align-self: flex-end;
            background: var(--ink);
            color: var(--bg);
            border-bottom-right-radius: 4px;
        }
        
        .msg.assistant {
            align-self: flex-start;
            background: var(--sf);
            border: 1px solid var(--line);
            border-bottom-left-radius: 4px;
            box-shadow: var(--sh);
        }
        
        .trio {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin: 14px 0;
        }
        
        .pn {
            background: var(--sf);
            border: 1px solid var(--line);
            border-radius: var(--r);
            padding: 18px;
            border-top: 5px solid var(--ink);
            box-shadow: var(--sh);
        }
        
        .pn.adv {
            border-top-color: var(--acc);
        }
        
        .pn.aud {
            border-top-color: var(--hot);
        }
        
        .pn h3 {
            margin: 0 0 8px;
            font-size: 17px;
            font-family: var(--serif);
        }
        /* Habit Matrix Table */
        
        .h-row {
            display: grid;
            grid-template-columns: 1fr repeat(7, 34px) 60px 30px;
            gap: 6px;
            align-items: center;
            padding: 8px 0;
            border-top: 1px solid var(--line);
        }
        
        .h-cell {
            all: unset;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--sf2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            margin: 0 auto;
            transition: transform 0.1s, background 0.12s;
        }
        
        .h-cell:hover {
            border-color: var(--acc);
            transform: scale(1.05);
        }
        
        .h-cell.on {
            background: var(--acc);
            border-color: var(--acc);
            color: #fff;
            font-weight: 700;
        }
        /* Pomodoro Banner */
        
        .pomo-box {
            background: linear-gradient(135deg, var(--sf), var(--sf2));
            border: 1px solid var(--line);
            border-radius: var(--r);
            padding: 16px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 14px;
        }
        
        .pomo-time {
            font-family: var(--mono);
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--acc);
        }
        /* Modals & Overlays */
        
        .ov {
            position: fixed;
            inset: 0;
            z-index: 40;
            background: rgba(12, 18, 16, 0.62);
            backdrop-filter: blur(4px);
            display: flex;
            overflow: auto;
            padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        }
        
        .ov[hidden] {
            display: none;
        }
        
        .sheet {
            background: var(--sf);
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            max-width: 650px;
            width: 100%;
            margin: auto;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }
        
        .sheet h2 {
            font-family: var(--serif);

            input, select, textarea { font-size: 16px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
        }
    </style>
</head>

<body>
    <!-- Dedicated Full-Screen Multi-Page Onboarding (#ob-app) -->
    <div class="ob-app" id="ob-app" hidden></div>

    <!-- Main Workspace Shell (#app-shell) - Only revealed after completing Onboarding -->
    <div class="app" id="app-shell" hidden>
        <aside class="side">
            <div class="brand-row">
                <div class="brand">
                    <h1>Lifedesk</h1>
                    <p>Personal Life OS</p>
                </div>
                <button class="icon-btn" id="thbtn" onclick="cycleTheme()" title="Switch theme" aria-label="Switch theme">◐</button>
            </div>
            <button class="cmd-trig" onclick="openCmd()">
      <span>Quick jump or add…</span>
      <kbd class="kbd">⌘K</kbd>
    </button>
            <div class="row" style="margin:0;gap:6px">
                <button class="btn alt sm" style="flex:1;justify-content:center" onclick="showSU(0)" title="Open full-page Life Blueprint Onboarding">✎ Blueprint</button>
                <button class="btn alt sm" style="flex:1;justify-content:center" onclick="startTour(0)" title="Interactive guided tour of every feature">✦ Suite Tour</button>
            </div>
            <nav id="nav"></nav>
        </aside>
        <main id="main"></main>
    </div>

    <div class="ov" id="mb" hidden></div>
    <div class="ov" id="ci" hidden></div>
    <div class="ov" id="cmd" hidden onclick="if(event.target===this)closeCmd()"></div>
    <div class="tour-dock" id="tour" hidden role="dialog" aria-label="Suite guided tour"></div>
    <div class="aist" id="aist" hidden></div>
    <div class="ov" id="gate" hidden style="z-index:200"></div>
    <script>
        const $ = s => document.querySelector(s);
        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[c]));
        const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
        const uid = () => Math.random().toString(36).slice(2, 9).replace(/[^a-z0-9]/gi, '');
        /* Safe JS string literal for use inside an HTML attribute handler, e.g. onclick="del(' + jq(id) + ')" */
        const jq = s => esc(JSON.stringify(String(s == null ? '' : s)));

        function toast(msg, ms) {
            let e = document.getElementById('toast');
            if (!e) {
                e = document.createElement('div');
                e.id = 'toast';
                e.setAttribute('role', 'alert');
                e.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:min(560px,calc(100vw - 32px));z-index:300;padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:13.5px;box-shadow:var(--sh)';
                document.body.appendChild(e);
            }
            e.textContent = msg;
            e.hidden = false;
            clearTimeout(e._t);
            e._t = setTimeout(() => {
                e.hidden = true;
            }, ms || 5000);
        }

        /* ---------- Persistent State (Unified Memory) ---------- */
        let S = {
            weather: {
                city: '',
                temp: '',
                cond: '',
                d: ''
            },
            notes: [],
            places: [],
            goals: [],
            work: [],
            chat: [],
            dec: [],
            brief: '',
            plan: '',
            wrev: '',
            tasks: [],
            events: [],
            mb: {},
            seenDay: '',
            lt: [],
            ciSeen: '',
            me: {
                name: '',
                home: '',
                work: '',
                share: true,
                done: false,
                role: '',
                workHours: '09:00–17:30, Mon–Fri',
                bio: '',
                commuteMin: 25,
                commuteMode: 'Subway/Train',
                hobbies: '',
                interests: '',
                fitnessStyle: '',
                sleepTarget: '7.5',
                favMusic: ''
            },
            music: null,
            recs: [],
            /* New full-life domains */
            habits: [],
            vitals: {},
            fin: {
                budget: 3000,
                paycheckAmt: 0,
                paycheckFreq: 'biweekly',
                nextPayday: '',
                fixedCosts: 0,
                tx: [],
                subs: []
            },
            people: [],
            shelf: [],
            theme: 'auto'
        };
        const SCHEMA = 2;
        const ARR_KEYS = ['notes', 'places', 'goals', 'work', 'chat', 'dec', 'tasks', 'events', 'lt', 'recs', 'habits', 'people', 'shelf'];
        const OB_DEFAULT = {
            step: 0,
            goalT: '',
            goalDue: '',
            ltT: '',
            ltWhy: '',
            presets: {
                read: true,
                move: true,
                plan: false,
                hydrate: false
            },
            customHabit: '',
            customCue: '',
            p1Name: '',
            p1Rel: 'Close Friend',
            p1Cad: 14,
            bookT: '',
            bookA: '',
            currIdx: 0,
            currSeen: {
                0: true
            }
        };
        try {
            const raw = localStorage.getItem('lifedesk');
            let loaded = {};
            if (raw) {
                try {
                    loaded = JSON.parse(raw);
                    if (!loaded || typeof loaded !== 'object' || Array.isArray(loaded)) throw 0;
                } catch (e) {
                    /* never silently discard unreadable data: keep a raw copy */
                    try {
                        localStorage.setItem('lifedesk-corrupt-' + Date.now(), raw);
                    } catch (_) {}
                    loaded = {};
                    window.addEventListener('DOMContentLoaded', () => toast('Saved data was unreadable. A raw copy was kept in localStorage as "lifedesk-corrupt-…".', 10000));
                }
            }
            const DEF_ME = Object.assign({}, S.me, {
                workMode: 'Hybrid'
            });
            Object.assign(S, loaded);
            S.me = Object.assign({}, DEF_ME, loaded.me || {});
            S.ob = Object.assign({}, OB_DEFAULT, loaded.ob || {});
            S.fin = Object.assign({
                budget: 3000,
                paycheckAmt: 0,
                paycheckFreq: 'biweekly',
                nextPayday: '',
                fixedCosts: 0,
                tx: [],
                subs: []
            }, loaded.fin || {});
            if (!Array.isArray(S.fin.tx)) S.fin.tx = [];
            if (!Array.isArray(S.fin.subs)) S.fin.subs = [];
            ARR_KEYS.forEach(k => {
                if (!Array.isArray(S[k])) S[k] = [];
            });
            ['vitals', 'mb'].forEach(k => {
                if (!S[k] || typeof S[k] !== 'object' || Array.isArray(S[k])) S[k] = {};
            });
            /* schema migrations go here: if ((loaded.v || 1) < 2) { … } */
            S.v = SCHEMA;
        } catch (e) {
            window.addEventListener('DOMContentLoaded', () => toast('Could not load saved data: ' + (e && e.message || e), 10000));
        }

        let saveWarned = false;
        const save = () => {
            try {
                if (S.chat.length > 200) S.chat = S.chat.slice(-200);
                localStorage.setItem('lifedesk', JSON.stringify(S));
                saveWarned = false;
                return true;
            } catch (e) {
                if (!saveWarned) {
                    saveWarned = true;
                    toast('Could not save — browser storage is full or blocked. Export a backup from Settings now.', 9000);
                }
                return false;
            }
        };

        function applyTheme() {
            const r = document.documentElement;
            if (S.theme === 'light' || S.theme === 'dark') r.setAttribute('data-theme', S.theme);
            else r.removeAttribute('data-theme');
            const b = $('#thbtn');
            if (b) b.textContent = S.theme === 'dark' ? '☾' : S.theme === 'light' ? '☀' : '◐';
        }

        function cycleTheme() {
            S.theme = S.theme === 'auto' ? 'light' : S.theme === 'light' ? 'dark' : 'auto';
            save();
            applyTheme();
        }
        applyTheme();

        /* ---------- AI Engine: Cloud API key or built-in hosted AI ---------- */
        /* ---- Built-in (hosted, rate-limited) AI. Set BUILTIN.url to your deployed proxy (see proxy-worker.js). NEVER put an API key in this file. ---- */
        const BUILTIN = {
            url: ''
        }; /* e.g. 'https://lifedesk-proxy.yourname.workers.dev' */
        const RL = {
            perDay: 30,
            gapMs: 3000
        }; /* client-side courtesy limits; the proxy enforces the real ones */
        function rlLeft() {
            let r = {};
            try {
                r = JSON.parse(localStorage.getItem('lifedesk-rl') || '{}');
            } catch (e) {}
            return r.d === dayKey() ? Math.max(0, RL.perDay - (r.n || 0)) : RL.perDay;
        }

        function rlTake() {
            let r = {};
            try {
                r = JSON.parse(localStorage.getItem('lifedesk-rl') || '{}');
            } catch (e) {}
            if (r.d !== dayKey()) r = {
                d: dayKey(),
                n: 0,
                t: 0
            };
            if (Date.now() - (r.t || 0) < RL.gapMs) throw {
                message: 'Easy there — wait a few seconds between AI requests.'
            };
            if (r.n >= RL.perDay) throw {
                message: 'Daily free AI limit reached (' + RL.perDay + '). Add your own API key in Settings to keep going, or come back tomorrow.'
            };
            r.n++;
            r.t = Date.now();
            try {
                localStorage.setItem('lifedesk-rl', JSON.stringify(r));
            } catch (e) {}
        }
        async function builtinAsk(msgs, on) {
            rlTake();
            if (!BUILTIN.url) { /* no proxy deployed: use the preset key/model directly */
                const pr = await fetch(PRESET.url.replace(/\/$/, '') + '/chat/completions', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json', authorization: 'Bearer ' + PRESET.key },
                    body: JSON.stringify({ model: PRESET.model, stream: true, messages: msgs })
                });
                if (pr.status === 429) throw { message: 'The free AI is rate-limited right now. Try again shortly.' };
                return sse(pr, x => x.choices && x.choices[0] && x.choices[0].delta && x.choices[0].delta.content, on);
            }
            const r = await fetch(BUILTIN.url.replace(/\/$/, '') + '/chat', {
                method: 'POST',
                headers: {
                    'content-type': 'application/json'
                },
                body: JSON.stringify({
                    messages: msgs
                })
            });
            if (r.status === 429) throw {
                message: 'The free AI service is rate-limited right now. Try again shortly, or add your own API key in Settings.'
            };
            return sse(r, x => x.choices && x.choices[0] && x.choices[0].delta && x.choices[0].delta.content, on);
        }
        /* ===== COMPETITION PRESET — edit these three values, then you're done. =====
           WARNING: anything here is readable by anyone who opens this file. Use a throwaway key
           with a quota limit and revoke it after judging. Leave key '' to disable the preset. */
        const PRESET = {
            key: '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',
            /* <-- paste your OpenRouter sk-or-... key between the quotes */
            model: 'nvidia/nemotron-3.5-lightning:free',
            /* <-- model id copied from openrouter.ai/models (free ones end in :free) */
            url: 'https://openrouter.ai/api/v1',
            provider: 'openai'
        };
        const usingPreset = () => !!PRESET.key && ENG.key === PRESET.key;

        function applyPreset() {
            if (!PRESET.key || ENG.key) return;
            ENG.mode = 'builtin'; /* no user key -> use the built-in (preset) AI */
        }
        const KEYK = 'lifedesk-key';
        let ENG = {
            mode: 'key',
            provider: 'anthropic',
            model: 'claude-sonnet-4-6',
            url: 'https://api.openai.com/v1',
            key: '',
            remember: false
        };
        try {
            const st = JSON.parse(localStorage.getItem('lifedesk-ai') || '{}');
            Object.assign(ENG, st);
            ENG.mode = ENG.mode === 'builtin' ? 'builtin' : 'key'; /* legacy 'auto'/'local' retired: a cloud key is the default */
            delete ENG.lm;
            if (ENG.model === 'claude-sonnet-5-5') ENG.model = 'claude-sonnet-4-6';
            let k = localStorage.getItem(KEYK);
            if (k) ENG.remember = true;
            else if (st.key) {
                k = st.key;
                ENG.remember = true;
                localStorage.setItem(KEYK, k);
            } /* migrate legacy key out of the settings blob */
            else k = sessionStorage.getItem(KEYK) || '';
            ENG.key = k || '';
            ENG.remember = !!ENG.remember;
        } catch (e) {}
        applyPreset();

        function persistEng() {
            const meta = Object.assign({}, ENG);
            delete meta.key;
            try {
                localStorage.setItem('lifedesk-ai', JSON.stringify(meta));
                localStorage.removeItem(KEYK);
                sessionStorage.removeItem(KEYK);
                if (ENG.key && !usingPreset())(ENG.remember ? localStorage : sessionStorage).setItem(KEYK, ENG.key);
            } catch (e) {
                toast('Could not store AI settings in this browser.');
            }
        }

        function aiReady() {
            return ENG.mode === 'builtin' ? !!(BUILTIN.url || PRESET.key) : !!ENG.key;
        }
        const stat = t => {
            const e = $('#aist');
            if (!e) return;
            e.hidden = !t;
            e.textContent = t || '';
        };

        async function sse(res, pick, on) {
            if (!res.ok) {
                let m = '';
                try {
                    const j = await res.json();
                    m = (j.error && j.error.message) || JSON.stringify(j.error || j);
                } catch (e) {}
                if (res.status === 401 || res.status === 403) throw {
                    message: 'API key rejected by provider (' + res.status + '). Check it under Settings → AI Engine.'
                };
                throw {
                    message: 'Provider returned ' + res.status + (m ? ': ' + m : '')
                };
            }
            const rd = res.body.getReader(),
                dec = new TextDecoder();
            let buf = '',
                t = '';
            for (;;) {
                const r = await rd.read();
                if (r.done) break;
                buf += dec.decode(r.value, {
                    stream: true
                });
                const ls = buf.split('\n');
                buf = ls.pop();
                for (const l of ls) {
                    if (l.indexOf('data:') !== 0) continue;
                    const d = l.slice(5).trim();
                    if (!d || d === '[DONE]') continue;
                    try {
                        const x = pick(JSON.parse(d));
                        if (x) {
                            t += x;
                            if (on) on(t);
                        }
                    } catch (e) {}
                }
            }
            return t;
        }

        async function cloudAsk(msgs, on) {
            if (ENG.provider === 'anthropic') {
                const r = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'content-type': 'application/json',
                        'x-api-key': ENG.key,
                        'anthropic-version': '2023-06-01',
                        'anthropic-dangerous-direct-browser-access': 'true'
                    },
                    body: JSON.stringify({
                        model: ENG.model,
                        max_tokens: 1024,
                        stream: true,
                        messages: msgs
                    })
                });
                return sse(r, x => x.type === 'content_block_delta' && x.delta && x.delta.text, on);
            }
            if (!/^https:\/\/|^http:\/\/(localhost|127\.0\.0\.1)(:|\/|$)/i.test(ENG.url)) throw {
                message: 'Base URL must use https:// (plain http is only allowed for localhost) so your key is never sent unencrypted.'
            };
            const r = await fetch(ENG.url.replace(/\/$/, '') + '/chat/completions', {
                method: 'POST',
                headers: {
                    'content-type': 'application/json',
                    authorization: 'Bearer ' + ENG.key
                },
                body: JSON.stringify({
                    model: ENG.model,
                    stream: true,
                    messages: msgs
                })
            });
            return sse(r, x => x.choices && x.choices[0] && x.choices[0].delta && x.choices[0].delta.content, on);
        }

        async function ask(input, on) {
            if (!aiReady()) throw {
                message: ENG.mode === 'builtin' ? 'The built-in AI is not configured in this build. Add an API key in Settings.' : 'An API key is required. Add one under Settings → AI Engine.'
            };
            const msgs = typeof input === 'string' ? [{
                role: 'user',
                content: input
            }] : input;
            return ENG.mode === 'builtin' ? builtinAsk(msgs, on) : cloudAsk(msgs, on);
        }

        /* ---------- Spotify PKCE Integration ---------- */
        const SPK = 'lifedesk-sp';
        let SP = {
                id: '',
                at: '',
                rt: '',
                exp: 0
            },
            spMsg = '';
        try {
            Object.assign(SP, JSON.parse(localStorage.getItem(SPK) || '{}'));
        } catch (e) {}
        const spSave = () => {
            try {
                localStorage.setItem(SPK, JSON.stringify(SP));
            } catch (e) {}
        };
        const spConn = () => !!(SP.id && SP.rt);
        const spRedirect = () => location.origin + location.pathname;
        const b64u = b => btoa(String.fromCharCode.apply(null, new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

        async function spConnect(fromOb) {
            const inp = fromOb ? $('#w_spid') : $('#spid');
            const id = ((inp && inp.value) || SP.id || '').trim(),
                m = $(fromOb ? '#w_spmsg' : '#spmsg');
            if (!id) {
                if (m) m.textContent = 'Paste your Spotify Client ID first.';
                return;
            }
            if (!(window.crypto && crypto.subtle)) {
                if (m) m.textContent = 'HTTPS is required for Spotify sign-in.';
                return;
            }
            if (fromOb) {
                syncWizStep();
                S.ob.step = 5;
                save();
            }
            SP.id = id;
            spSave();
            const v = b64u(crypto.getRandomValues(new Uint8Array(48))),
                st = b64u(crypto.getRandomValues(new Uint8Array(12))),
                ch = b64u(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
            try {
                localStorage.setItem('lifedesk-pk', v + '|' + st + '|' + (fromOb ? 'ob' : 'app'));
            } catch (e) {}
            location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
                response_type: 'code',
                client_id: id,
                scope: 'user-top-read',
                redirect_uri: spRedirect(),
                code_challenge_method: 'S256',
                code_challenge: ch,
                state: st
            });
        }

        async function spToken(p) {
            const r = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: {
                    'content-type': 'application/x-www-form-urlencoded'
                },
                body: new URLSearchParams(Object.assign({
                    client_id: SP.id
                }, p))
            });
            const j = await r.json();
            if (!r.ok) throw {
                message: j.error_description || j.error || 'Spotify sign-in failed'
            };
            SP.at = j.access_token;
            if (j.refresh_token) SP.rt = j.refresh_token;
            SP.exp = Date.now() + (j.expires_in - 60) * 1000;
            spSave();
        }

        async function spCallback() {
            const q = new URLSearchParams(location.search),
                code = q.get('code'),
                st = q.get('state'),
                er = q.get('error');
            if (!code && !er) return false;
            history.replaceState(null, '', location.pathname);
            const pk = (localStorage.getItem('lifedesk-pk') || '').split('|');
            localStorage.removeItem('lifedesk-pk');
            const originMode = pk[2] || 'app';
            if (er) {
                spMsg = 'Spotify returned: ' + er;
                return originMode;
            }
            if (!pk[1] || pk[1] !== st) {
                spMsg = 'Sign-in state mismatch. Try connecting again.';
                return originMode;
            }
            await spToken({
                grant_type: 'authorization_code',
                code,
                redirect_uri: spRedirect(),
                code_verifier: pk[0]
            });
            return originMode;
        }
        async function spApi(path) {
            if (Date.now() > SP.exp) await spToken({
                grant_type: 'refresh_token',
                refresh_token: SP.rt
            });
            const r = await fetch('https://api.spotify.com/v1' + path, {
                headers: {
                    authorization: 'Bearer ' + SP.at
                }
            });
            if (r.status === 403) throw {
                message: 'Spotify refused (403). Ensure your account is added under User Management in your Spotify Developer Dashboard.'
            };
            if (r.status === 429) throw {
                message: 'Spotify rate limit reached. Try again in a minute.'
            };
            if (!r.ok) throw {
                message: 'Spotify error ' + r.status
            };
            return r.json();
        }

        function spOut() {
            SP = {
                id: SP.id,
                at: '',
                rt: '',
                exp: 0
            };
            spSave();
            render();
        }
        const mm = t => {
            const e = $('#mmsg');
            if (e) e.textContent = t || '';
        };

        async function refreshMusic() {
            const b = $('#mrb');
            if (b) b.disabled = true;
            mm('');
            try {
                const a = await spApi('/me/top/artists?time_range=short_term&limit=20'),
                    t = await spApi('/me/top/tracks?time_range=short_term&limit=20');
                const ar = (a.items || []).map(x => ({
                        n: x.name,
                        g: x.genres || []
                    })),
                    g = {};
                ar.forEach(x => x.g.forEach(y => {
                    g[y] = (g[y] || 0) + 1;
                }));
                S.music = {
                    at: dayKey(),
                    artists: ar,
                    genres: Object.keys(g).sort((x, y) => g[y] - g[x]).slice(0, 10),
                    tracks: (t.items || []).map(x => ({
                        n: x.name,
                        a: (x.artists || []).map(y => y.name).join(', ')
                    }))
                };
                save();
                render();
            } catch (e) {
                mm((e && e.message) || 'Spotify request failed');
                if (b) b.disabled = false;
            }
        }

        async function findMusic() {
            const b = $('#mfb');
            mm('');
            if (!S.music) {
                await refreshMusic();
                if (!S.music) return;
            }
            const m = S.music;
            if (b) b.disabled = true;
            const o = () => $('#mrec');
            if (o()) o().innerHTML = '<p class="mute">Curating tracks from your taste and day context…</p>';
            const known = new Set(m.artists.map(a => a.n.toLowerCase()));
            try {
                const txt = await ask(
                    P.music + '\n\nListening, last 4 weeks:\nTop artists: ' + m.artists.slice(0, 15).map(a => a.n).join(', ') +
                    '\nTop genres: ' + (m.genres.join(', ') || 'unknown') +
                    '\nTop tracks: ' + m.tracks.slice(0, 12).map(t => t.n + ' by ' + t.a).join('; ') +
                    '\n\nUser context:\n' + ctx(),
                    x => {
                        if (o()) o().innerHTML = '<div class="card txt">' + fmt(x) + '</div>';
                    }
                );
                const rows = txt.split('\n').map(l => l.replace(/^\s*[-*\u2022]?\s*\d*[.)]?\s*/, '').split('|').map(x => x.trim())).filter(r => r.length >= 2 && r[0] && r[1] && !known.has(r[0].toLowerCase())).slice(0, 8);
                if (!rows.length) {
                    if (o()) o().innerHTML = '<div class="card txt">' + fmt(txt) + '</div><p class="mute">Model output was freeform. Try again or switch models.</p>';
                    if (b) b.disabled = false;
                    return;
                }
                const R = [];
                for (const r of rows) {
                    let hit = null;
                    try {
                        const j = await spApi('/search?type=track&limit=3&q=' + encodeURIComponent('track:' + r[1] + ' artist:' + r[0]));
                        hit = ((j.tracks && j.tracks.items) || [])[0];
                    } catch (e) {}
                    const link = hit && hit.external_urls && hit.external_urls.spotify;
                    R.push(hit ? {
                        t: hit.name,
                        a: (hit.artists || []).map(y => y.name).join(', '),
                        why: r[2] || '',
                        url: link || 'https://open.spotify.com/search/' + encodeURIComponent(r[0] + ' ' + r[1]),

        /* ---------- Core Helpers, Dates & Sub-views ---------- */
        function dayKey() {
            return new Date().toLocaleDateString('en-CA');
        }
        const ago = n => new Date(Date.now() - n * 864e5).toLocaleDateString('en-CA');
        const daysBetween = (d1, d2) => Math.round((new Date(d2 + 'T00:00') - new Date(d1 + 'T00:00')) / 864e5);

        let tab = 'today',
            goalSub = 'short',

        /* Pomodoro Focus Timer State */
        let pomo = {
            rem: 1500,
            run: false,
            iv: null,
            task: ''
        };

        function fmtPomo(s) {
            return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
        }

        function togglePomo() {
            if (pomo.run) {
                clearInterval(pomo.iv);
                pomo.run = false;
            } else {
                pomo.run = true;
                pomo.iv = setInterval(() => {
                    if (pomo.rem > 0) {
                        pomo.rem--;
                        const el = $('#pomo-clock');
                        if (el) el.textContent = fmtPomo(pomo.rem);
                    } else {
                        clearInterval(pomo.iv);
                        pomo.run = false;
                        stat('Focus session complete! Take a 5-minute breather.');
                        setTimeout(() => stat(''), 4000);
                        render();
                    }
                }, 1000);
            }
            render();
        }

        function resetPomo(mins) {

        /* Habits & Streaks */
        function habitStreak(h) {
            const lg = h.log || {};
            let n = 0,
                i = lg[dayKey()] ? 0 : 1;
            while (lg[ago(i)]) {
                n++;
                i++;
            }
            return n;
        }

        function toggleHabit(id, d) {
            const h = S.habits.find(x => x.id === id);

            h.log = h.log || {};

        /* Vitals / Pulse */

        /* Finance calculations */
        const FREQ_MULT = {
            weekly: 4.333,
            biweekly: 2.167,
            semimonthly: 2,
            monthly: 1,
            irregular: 1

        const FREQ_LBL = {
            weekly: 'Weekly',
            biweekly: 'Every 2 weeks',
            semimonthly: 'Twice a month',
            monthly: 'Monthly',
            irregular: 'Irregular / Freelance'
        };

        function estMonthlyNet(amt, freq) {
            const a = +(amt != null ? amt : S.fin.paycheckAmt) || 0;
            const f = freq || S.fin.paycheckFreq || 'biweekly';
            return Math.round(a * (FREQ_MULT[f] || 2.167));
        }

        function logPaycheckNow() {
            const amt = +S.fin.paycheckAmt || 0;
            if (!amt) return;
            S.fin.tx.unshift({

            if (S.fin.nextPayday) {
                const dt = new Date(S.fin.nextPayday + 'T00:00');
                const f = S.fin.paycheckFreq;
                if (f === 'weekly') dt.setDate(dt.getDate() + 7);
                else if (f === 'biweekly') dt.setDate(dt.getDate() + 14);
                else if (f === 'semimonthly') dt.setDate(dt.getDate() + 15);
                else if (f === 'monthly') dt.setMonth(dt.getMonth() + 1);
                S.fin.nextPayday = dt.toLocaleDateString('en-CA');

            save();
            render();

        function monthSpent() {
            const ym = dayKey().slice(0, 7);
            return (S.fin.tx || []).filter(x => x.d.slice(0, 7) === ym && x.type !== 'in').reduce((a, b) => a + (+b.amt || 0), 0);
        }

        function monthIncome() {
            const ym = dayKey().slice(0, 7);
            return (S.fin.tx || []).filter(x => x.d.slice(0, 7) === ym && x.type === 'in').reduce((a, b) => a + (+b.amt || 0), 0);
        }

            return (S.fin.subs || []).reduce((a, b) => a + (+b.amt || 0), 0);

        /* People CRM */
        function overduePeople() {
            const today = dayKey();

        /* Long-term Goals & Check-ins */
        let ciMsg = '';

        const logOn = (g, d) => (g.log || []).find(x => x.d === d);
        const lastLog = g => (g.log || []).slice().sort((a, b) => b.d.localeCompare(a.d))[0];
        const worked = x => x && x.m !== 'skip';

        function streak(g) {
            let n = 0,
                i = logOn(g, dayKey()) ? 0 : 1;
            while (worked(logOn(g, ago(i)))) {
                n++;

        const pendingCI = () => S.lt.filter(g => !logOn(g, ciDate()));
        const MLBL = {

        /* Schedule & Deterministic Conflict Engine */
        const tm = t => {
            const a = (t || '').split(':');
            return a.length === 2 ? +a[0] * 60 + +a[1] : null;
        };
        const hm = n => {
            n = ((Math.round(n) % 1440) + 1440) % 1440;
            return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');
        };
        const place = id => S.places.find(p => p.id === id);
        const evTravel = e => e.c > 0 ? e.c : (place(e.p) ? +place(e.p).c || 0 : 0);
        const evs = k => S.events.filter(e => e.date === k).sort((a, b) => (a.s || '99').localeCompare(b.s || '99'));
        const evEnd = e => {
            const s = tm(e.s),
                f = tm(e.e);
            return f != null && f > s ? f : s + 60;
        };
        const evLine = e => (e.s ? e.s + (e.e ? '–' + e.e : '') : 'All day') + ' ' + e.t + (place(e.p) ? ' @ ' + place(e.p).n : '');

        function upcoming() {
            const a = dayKey(),
                b = new Date(Date.now() + 7 * 864e5).toLocaleDateString('en-CA');
            return S.events.filter(e => e.date >= a && e.date <= b).sort((x, y) => (x.date + (x.s || '')).localeCompare(y.date + (y.s || ''))).map(e => '- ' + e.date + ' ' + evLine(e) + (evTravel(e) ? ' (travel ~' + evTravel(e) + ' min)' : ''));
        }

        function conflicts(k) {
            const out = [],
                E = evs(k).filter(e => tm(e.s) != null),
                T = S.tasks.filter(t => t.date === k && !t.done && tm(t.time) != null);
            const items = E.map(e => ({
                n: e.t,
                s: tm(e.s),
                f: evEnd(e),
                tr: evTravel(e),
                p: e.p
            }));
            const all = items.concat(T.map(t => ({
                n: t.t + ' (task)',
                s: tm(t.time),
                f: tm(t.time) + 30
            }))).sort((a, b) => a.s - b.s);
            for (let i = 0; i < all.length; i++) {
                for (let j = i + 1; j < all.length; j++) {
                    const a = all[i],
                        b = all[j];
                    if (b.s < a.f) out.push({
                        k: 'overlap',
                        s: 'Overlap: ' + a.n + ' (' + hm(a.s) + '–' + hm(a.f) + ') runs into ' + b.n + ' at ' + hm(b.s)
                    });
                }
            }
            items.forEach((b, i) => {
                const a = items[i - 1];
                if (!a) {
                    if (b.tr > 0) out.push({
                        k: 'leave',
                        s: 'Leave by ' + hm(b.s - b.tr) + ' for ' + b.n + ' (' + b.tr + ' min travel)'
                    });
                    return;
                }
                if (b.s >= a.f && b.tr > 0 && (a.p !== b.p || !b.p)) {
                    const gap = b.s - a.f;
                    out.push(gap < b.tr ? {
                        k: 'tight',
                        s: 'Tight connection: ' + gap + ' min between ' + a.n + ' and ' + b.n + ', but travel is ~' + b.tr + ' min'
                    } : {
                        k: 'leave',
                        s: 'Leave ' + a.n + ' by ' + hm(b.s - b.tr) + ' to reach ' + b.n
                    });
                }
            });
            S.goals.filter(g => g.due === k && g.p < 100).forEach(g => out.push({
                k: 'goal',
                s: 'Goal due today: ' + g.t + ' (' + g.p + '% done)'
            }));
            return out;
        }

                'Goals:\n' + (S.goals.map(g => '- ' + g.t + ' (' + g.p + '% done' + (g.due ? ', due ' + g.due : '') + ')').join('\n') || 'none'),

                'Daily Habits:\n' + (S.habits.map(h => '- ' + h.t + ' (' + (h.log && h.log[dayKey()] ? 'done today' : 'open today') + ', streak ' + habitStreak(h) + 'd)').join('\n') || 'none'),
                'Today’s planner checklist:\n' + (S.tasks.filter(t => t.date === dayKey() || (!t.done && t.date < dayKey())).map(t => '- ' + (t.time ? t.time + ' ' : '') + t.t + (t.done ? ' [done]' : ' [open]')).join('\n') || 'none'),

        /* ---------- Prompts ---------- */
        const P = {

            const b = $('#tb');
            if (b) {
                b.disabled = true;
                b.textContent = 'Planning…';
            }
            try {
                const r = await ask(P.day + '\n\nUser context:\n' + ctx());
                let n = 0;
                r.split('\n').forEach(l => {
                    const m = l.match(/^\s*(?:(\d{1,2}:\d{2})\s*)?\|\s*(.+)$/);
                    if (m) {
                        let tm = m[1] || '';
                        if (tm.length === 4) tm = '0' + tm;
                        S.tasks.push({
                            id: uid(),
                            t: m[2].trim(),
                            time: tm,
                            date: dayKey(),
                            done: false
                        });
                        n++;
                    }
                });
                save();
                render();
                if (!n && $('#tout')) $('#tout').innerHTML = '<p class="err">Model returned no structured tasks. Try again.</p>';
            } catch (e) {
                if (b) {
                    b.disabled = false;
                    b.textContent = '✦ AI Plan My Day';

                if ($('#tout')) $('#tout').innerHTML = '<p class="err">' + esc(bad(e)) + '</p>';

        async function send() {
            const i = $('#chat-in');
            if (!i) return;
            const t = i.value.trim();
            if (!t) return;
            S.chat.push({
                role: 'user',
                content: t
            });
            save();
            const m = S.chat.slice(-12).map(x => ({
                role: x.role,
                content: x.content
            }));
            while (m.length && m[0].role !== 'user') m.shift();
            m[m.length - 1].content = P.chat + '\n\nUser context:\n' + ctx() + '\n\nUser message: ' + t;
            S.chat.push({
                role: 'assistant',
                content: ''
            });
            render();
            const last = () => S.chat[S.chat.length - 1];
            try {
                last().content = await ask(m, x => {
                    const e = $('#last');
                    if (e) e.innerHTML = fmt(x);
                });

                last().content = bad(e);

            const b = $('#db'),
                o = $('#dout');
            if (b) b.disabled = true;
            if (o) o.innerHTML = '<div class="trio">' + [
                ['adv', 'Advocate'],

            ].map(k => '<section class="pn ' + k[0] + '"><h3>' + k[1] + '</h3><div id="o-' + k[0] + '" class="txt">' + (k[0] === 'ver' ? '<span class="mute">Waiting for Advocate & Auditor…</span>' : 'Analyzing…') + '</div></section>').join('') + '</div>';
            const base = 'User context:\n' + ctx() + '\n\nIdea or decision: ' + q;
            const set = (id, x) => {
                const e = $('#o-' + id);
                if (e) e.innerHTML = fmt(x);

            try {
                const A1 = () => ask(P.adv + '\n\n' + base, x => set('adv', x)),
                    U1 = () => ask(P.aud + '\n\n' + base, x => set('aud', x));

                    q,
                    a: r[0],
                    u: r[1],
                    v
                });
                save();

                if ($('#dout')) $('#dout').insertAdjacentHTML('afterbegin', '<p class="err">' + esc(bad(e)) + '</p>');

        function drawCmd(q) {

            $('#cmd').innerHTML = '<div class="sheet" style="max-width:520px;margin-top:10vh" role="dialog" aria-modal="true" aria-label="Command Palette">' +
                '<input id="cmd-q" placeholder="Type a command or destination…" value="' + esc(q) + '" oninput="drawCmd(this.value)" onkeydown="if(event.key===\'Escape\')closeCmd();if(event.key===\'Enter\'&&window._topCmd){window._topCmd();closeCmd()}" style="width:100%;font-size:16px">' +
                '<div class="cmd-list">' +
                list.map((c, i) => '<button class="cmd-item' + (i === 0 ? ' act' : '') + '" onclick="CMDS[' + CMDS.indexOf(c) + '][1]();closeCmd()"><span>' + esc(c[0]) + '</span><span class="kbd">↵</span></button>').join('') +
                '</div></div>';
            window._topCmd = list[0] ? list[0][1] : null;
            const inp = $('#cmd-q');
            if (inp) {
                inp.focus();
                inp.setSelectionRange(inp.value.length, inp.value.length);
            }
        }
        const topOverlay = () => ['gate', 'cmd', 'ci', 'mb'].map(i => $('#' + i)).find(el => el && !el.hidden);
        window.addEventListener('keydown', e => {
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                if (!$('#gate').hidden) return;
                if ($('#cmd').hidden) openCmd();
                else closeCmd();
                return;
            }
            const o = topOverlay();
            if (!o) return;
            if (e.key === 'Escape' && o.id !== 'gate') {
                if (o.id === 'cmd') closeCmd();
                else if (o.id === 'ci') closeCI();
                else closeMB();
                return;
            }
            if (e.key === 'Tab') {
                const f = [...o.querySelectorAll('button,input,select,textarea,summary,a[href],[tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled && x.offsetParent !== null);
                if (!f.length) return;
                const first = f[0],
                    last = f[f.length - 1],
                    cur = document.activeElement;
                if (!o.contains(cur)) {
                    e.preventDefault();
                    first.focus();
                } else if (e.shiftKey && cur === first) {
                    e.preventDefault();
                    last.focus();
                } else if (!e.shiftKey && cur === last) {
                    e.preventDefault();
                    first.focus();
                }
            }
        });

            const kb = document.querySelector('.cmd-trig .kbd');
            if (kb && !/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent)) kb.textContent = 'Ctrl K';

        function impData() {
            const x = $('#ex');
            try {
                const o = JSON.parse(val('ex'));
                if (!o || typeof o !== 'object' || Array.isArray(o)) throw new Error('backup must be a JSON object');
                const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
                const cleanId = v => String(v || '').replace(/[^a-z0-9]/gi, '') || uid();
                const withIds = arr => arr.filter(isObj).map(i => Object.assign({}, i, {
                    id: cleanId(i.id)
                }));
                const ID_LISTS = ['notes', 'places', 'goals', 'work', 'tasks', 'events', 'lt', 'habits', 'people', 'shelf'];
                const PLAIN_LISTS = ['chat', 'dec', 'recs'];
                const OBJS = ['me', 'fin', 'vitals', 'mb', 'ob', 'weather'];
                const STRS = ['brief', 'plan', 'wrev', 'ciSeen', 'seenDay'];
                const next = Object.assign({}, S);
                ID_LISTS.forEach(k => {
                    if (k in o) {
                        if (!Array.isArray(o[k])) throw new Error('"' + k + '" must be a list');
                        next[k] = withIds(o[k]);
                    }
                });
                PLAIN_LISTS.forEach(k => {
                    if (k in o) {
                        if (!Array.isArray(o[k])) throw new Error('"' + k + '" must be a list');
                        next[k] = o[k];
                    }
                });
                OBJS.forEach(k => {
                    if (k in o) {
                        if (!isObj(o[k])) throw new Error('"' + k + '" must be an object');
                        next[k] = Object.assign({}, S[k], o[k]);
                    }
                });
                STRS.forEach(k => {
                    if (typeof o[k] === 'string') next[k] = o[k];
                });
                if ('music' in o && (o.music === null || isObj(o.music))) next.music = o.music;
                if (['auto', 'light', 'dark'].includes(o.theme)) next.theme = o.theme;
                next.fin.tx = withIds(Array.isArray(next.fin.tx) ? next.fin.tx : []).map(x => Object.assign({
                    d: dayKey(),
                    t: '',
                    a: 0
                }, x));
                next.fin.subs = withIds(Array.isArray(next.fin.subs) ? next.fin.subs : []);
                try {
                    localStorage.setItem('lifedesk-prev', JSON.stringify(S));
                } catch (_) {}
                S = next;
                S.v = SCHEMA;
                if (save()) toast('Backup imported. Your previous data is kept as “lifedesk-prev”.');
                render();
            } catch (e) {
                if (x) {
                    x.value = '';
                    x.placeholder = 'Import failed: ' + ((e && e.message) || 'invalid JSON') + '. Nothing was changed.';
                }
            }
        }

            badge: 'Stop 12 of 14 · AI Council',
            title: 'Context-Aware Assistant Chat',
            what: 'A direct conversational line to Lifedesk with one-click starter prompts.',
            purpose: 'Unlike generic chatbots, you never have to explain your job, commute, budget, or goals—it already knows.',
            ai: 'Streams responses from your chosen cloud provider using your own API key.'
        }, {
            tab: 'decide',
            badge: 'Stop 13 of 14 · AI Council',
            title: 'The Decision Triad (Advocate · Auditor · Judge)',
            what: 'A 3-agent deliberation engine that debates any life, career, or financial decision you enter.',
            purpose: 'The Advocate builds the strongest case FOR your idea; the Auditor stress-tests hidden costs and failure modes; the Judge delivers a balanced verdict.',
            ai: 'Cross-references your paycheck runway, schedule load, energy, and 90-day goals during the debate.'
        }, {
            tab: 'review',
            badge: 'Stop 14 of 14 · AI Council & System',
            title: 'Weekly Executive Review',
            what: 'Synthesizes all 7 domains of your life into Wins & Momentum, Bottlenecks & Drift, and 3 Focus Levers for next week.',
            purpose: 'Closes the loop every Sunday so each week builds intentionally on the last. You can re-run the Life Survey or this Tour anytime from the sidebar.',
            ai: 'Reads your full cross-domain history to surface patterns you might miss day-to-day.'
        }];

        function startTour(idx) {
            tourIdx = typeof idx === 'number' ? idx : 0;
            $('#tour').hidden = false;
            syncTourStep();
        }

        function closeTour() {
            $('#tour').hidden = true;
            render();
        }

        function syncTourStep() {
            const st = TOUR_STEPS[tourIdx];
            if (!st) {
                closeTour();
                return;
            }
            if (st.sub) st.sub();
            tab = st.tab;
            render();
            const pct = Math.round(((tourIdx + 1) / TOUR_STEPS.length) * 100);
            $('#tour').innerHTML =
                '<div class="tour-meta"><span class="chip acc">' + esc(st.badge) + '</span><button class="x" onclick="closeTour()" title="Close tour">✕</button></div>' +
                '<div class="bar" style="margin:0 0 10px"><i style="width:' + pct + '%"></i></div>' +
                '<h3 style="font-family:var(--serif);font-size:20px;margin:0 0 6px">' + esc(st.title) + '</h3>' +
                '<div class="tour-blk"><b>What It Is</b>' + esc(st.what) + '</div>' +
                '<div class="tour-blk"><b>Purpose & Why It Matters</b>' + esc(st.purpose) + '</div>' +
                '<div class="tour-blk"><b>How Shared AI Uses It</b>' + esc(st.ai) + '</div>' +
                '<div class="row" style="margin:12px 0 0;justify-content:space-between">' +
                '<button class="btn alt sm" onclick="closeTour()">End Tour</button>' +
                '<div class="row" style="margin:0">' +
                (tourIdx > 0 ? '<button class="btn alt sm" onclick="startTour(' + (tourIdx - 1) + ')">← Prev</button>' : '') +
                (tourIdx < TOUR_STEPS.length - 1 ?
                    '<button class="btn sm" onclick="startTour(' + (tourIdx + 1) + ')">Next Feature →</button>' :
                    '<button class="btn sm" onclick="closeTour();go(\'today\');showMB()">Finish & Open Morning Brief ✦</button>') +
                '</div>' +
                '</div>';
        }

        spCallback().then(function(mode) {
            if (mode === 'ob' || !S.me.done) {
                if (mode === 'ob') S.ob.step = 5;
                showSU(S.ob.step || 0);
                if (SP.at && !S.music) refreshMusic();
            } else if (mode) {
                $('#ob-app').hidden = true;
                $('#app-shell').hidden = false;
                tab = SP.at ? 'music' : 'set';
                render();
                if (SP.at && !S.music) refreshMusic();
            }
        }).catch(function(e) {
            spMsg = (e && e.message) || 'Spotify sign-in failed';
            if (!S.me.done) showSU(5);
            else {
                $('#ob-app').hidden = true;
                $('#app-shell').hidden = false;
                tab = 'set';
                render();
            }
        });

        if (!S.me.done) {
            showSU(S.ob.step || 0);
        } else {
            $('#ob-app').hidden = true;
            $('#app-shell').hidden = false;
            render();
            startDay();
        }
        /* Keep the active tab visible in the mobile nav scroller */
        try {
            new MutationObserver(function() {
                var b = document.querySelector('nav button.on');
                if (b && matchMedia('(max-width:920px)').matches) {
                    var n = b.closest('nav');
                    n.scrollTo({
                        left: b.offsetLeft - n.clientWidth / 2 + b.offsetWidth / 2,
                        behavior: 'smooth'
                    });
                }
            }).observe(document.getElementById('nav'), {
                childList: true,
                subtree: true
            });
        } catch (e) {}
    </script>
</body>

</html>
